services:
  - type: web
    name: facebook-bulk-scheduler-pro-3-p6-worker
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 300
    envVars:
      - key: PHASE3_API_URL
        value: https://facebook-bulk-scheduler-pro-3-p3-api.onrender.com
      - key: PHASE6_WORKER_SECRET
        sync: false
      - key: PUBLISH_MAX_PAGE_WORKERS_PER_CUSTOMER
        value: "10"
      - key: PHASE6_POLL_INTERVAL_MS
        value: "5000"
