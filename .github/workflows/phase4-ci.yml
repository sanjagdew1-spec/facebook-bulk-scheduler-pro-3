name: Phase 4 Customer Website CI
on:
  push:
    branches:
      - phase-4/owner-admin-control-panel
  pull_request:
    branches:
      - phase-4/owner-admin-control-panel
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check admin-routes.js
      - run: node --check customer-auth-routes.js
      - run: node --check test/admin-routes.test.js
      - run: node --check test/phase4-customer-site.test.js
      # The legacy deployment-config test hardcodes the Phase 2 static-site layout,
      # while this branch intentionally carries the Phase 3 scheduler + Phase 4 landing page.
      - run: node --test test/phase4-customer-site.test.js test/admin-routes.test.js test/customer-auth.test.js test/customer-auth-routes.test.js test/frontend-syntax.test.js test/server-integration.test.js test/tenant-isolation-sql.test.js test/tenant-security.test.js test/token-crypto.test.js
