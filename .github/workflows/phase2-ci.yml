name: Phase 2 checks

on:
  push:
    branches:
      - "phase-2/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check customer-auth.js
          node --check customer-auth-routes.js
          node --check tenant-security.js
      - name: Run unit tests
        run: npm test
