name: Phase 7 direct scheduling checks

on:
  push:
    branches:
      - "phase-7/**"
  pull_request:
    branches:
      - "phase-3/ui-workflow"
      - "phase-4/owner-admin-control-panel"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Check Phase 7 backend syntax
        run: |
          node --check server.js
          node --check meta-direct-scheduler.js
      - name: Run Phase 7 and Phase 6 regression tests
        run: node --test test/meta-direct-scheduler.test.js test/phase6-claim-window.test.js test/phase6-worker-bridge.test.js test/tenant-isolation-sql.test.js test/tenant-security.test.js test/token-crypto.test.js
